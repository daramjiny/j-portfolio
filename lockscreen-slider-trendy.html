<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lock Screen Slider Trendy Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Bricolage+Grotesque:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-1: #0b1222;
        --bg-2: #0f2437;
        --bg-3: #13363c;
        --accent: #6df5d8;
        --accent-2: #6aa8ff;
        --text: #eef6ff;
        --glass: rgba(255, 255, 255, 0.08);
        --border: rgba(255, 255, 255, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "Space Grotesk", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        color: var(--text);
        background:
          radial-gradient(1200px 600px at 12% 8%, #295f84 0%, rgba(41, 95, 132, 0) 60%),
          radial-gradient(900px 500px at 85% 80%, #1f8d6e 0%, rgba(31, 141, 110, 0) 62%),
          linear-gradient(145deg, var(--bg-1), var(--bg-2) 58%, var(--bg-3));
        overflow: hidden;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: -25vmax;
        pointer-events: none;
      }

      body::before {
        background:
          conic-gradient(from 40deg at 50% 50%, rgba(109, 245, 216, 0.24), rgba(107, 149, 255, 0.08), rgba(255, 255, 255, 0));
        animation: drift 18s linear infinite;
      }

      body::after {
        background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
        background-size: 20px 20px;
        mix-blend-mode: soft-light;
        opacity: 0.4;
      }

      .stage {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: clamp(20px, 3vw, 34px);
      }

      .deck {
        width: min(1100px, 100%);
        display: grid;
        grid-template-columns: 1fr minmax(300px, 390px);
        gap: clamp(20px, 3vw, 48px);
        align-items: center;
      }

      .copy {
        transform: translateY(12px);
        opacity: 0;
        animation: reveal 900ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border);
        background: var(--glass);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        backdrop-filter: blur(8px);
      }

      .eyebrow::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), #bcfff4);
        box-shadow: 0 0 0 6px rgba(109, 245, 216, 0.2);
      }

      h1 {
        margin: 16px 0 10px;
        font-family: "Bricolage Grotesque", sans-serif;
        font-size: clamp(34px, 5vw, 56px);
        line-height: 1.03;
        letter-spacing: -0.02em;
      }

      .copy p {
        margin: 0;
        max-width: 36ch;
        font-size: clamp(14px, 2vw, 18px);
        line-height: 1.7;
        color: rgba(238, 246, 255, 0.85);
      }

      .tips {
        margin-top: 18px;
        font-size: 13px;
        color: rgba(238, 246, 255, 0.72);
      }

      .phone-wrap {
        position: relative;
        transform-style: preserve-3d;
        opacity: 0;
        animation: reveal 1200ms cubic-bezier(0.16, 1, 0.3, 1) 120ms forwards;
      }

      .phone {
        position: relative;
        width: min(390px, 100%);
        aspect-ratio: 9 / 19.5;
        border-radius: 46px;
        padding: 14px;
        background:
          linear-gradient(160deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.02) 35%),
          linear-gradient(220deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
        border: 1px solid rgba(255, 255, 255, 0.34);
        box-shadow:
          0 36px 70px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
        transform: perspective(1200px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
        transition: transform 250ms ease-out;
      }

      .phone::before {
        content: "";
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        width: 34%;
        height: 34px;
        border-radius: 999px;
        background: rgba(5, 8, 15, 0.92);
        z-index: 6;
      }

      .viewport {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 36px;
        overflow: hidden;
        touch-action: pan-y;
        background: #090f1c;
      }

      .slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        transform: scale(1.08);
        transition: transform 800ms cubic-bezier(0.22, 1, 0.36, 1), opacity 500ms ease;
      }

      .slide::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(to top, rgba(0, 0, 0, 0.62), rgba(0, 0, 0, 0.08) 38%, rgba(0, 0, 0, 0.28));
      }

      .slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.03);
      }

      .slide.active {
        opacity: 1;
        transform: scale(1);
        z-index: 2;
      }

      .slide.active img {
        animation: kenburns 6.8s ease-out both;
      }

      .meta {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 24px;
        z-index: 5;
        display: grid;
        gap: 10px;
      }

      .clock {
        font-size: clamp(40px, 9vw, 58px);
        font-weight: 500;
        letter-spacing: -0.02em;
        line-height: 0.95;
      }

      .date {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.86);
      }

      .notice {
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 18px;
        background: rgba(13, 18, 33, 0.45);
        backdrop-filter: blur(12px);
        padding: 12px 14px;
        font-size: 13px;
        color: rgba(248, 251, 255, 0.9);
      }

      .controls {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: calc(100% + 76px);
        display: flex;
        justify-content: space-between;
        pointer-events: none;
      }

      .btn {
        pointer-events: auto;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: rgba(13, 19, 34, 0.54);
        color: var(--text);
        display: grid;
        place-items: center;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: transform 180ms ease, background 180ms ease;
      }

      .btn:hover {
        transform: scale(1.07);
        background: rgba(109, 245, 216, 0.24);
      }

      .progress {
        position: absolute;
        right: -56px;
        top: 50%;
        transform: translateY(-50%);
        display: grid;
        gap: 9px;
      }

      .dot {
        width: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.26);
        height: 14px;
        overflow: hidden;
      }

      .dot span {
        display: block;
        width: 100%;
        height: 0%;
        background: linear-gradient(to bottom, var(--accent), var(--accent-2));
        border-radius: inherit;
        transition: height 200ms linear;
      }

      .dragging .slide {
        transition-duration: 140ms;
      }

      @media (max-width: 920px) {
        .deck {
          grid-template-columns: 1fr;
          justify-items: center;
        }

        .copy {
          text-align: center;
        }

        .copy p {
          margin-inline: auto;
        }

        .controls {
          width: calc(100% + 40px);
        }

        .progress {
          right: 50%;
          top: auto;
          bottom: -26px;
          transform: translateX(50%);
          grid-auto-flow: column;
          align-items: end;
        }

        .dot {
          width: 18px;
          height: 4px;
        }

        .dot span {
          width: 0%;
          height: 100%;
          transition: width 200ms linear;
        }
      }

      @keyframes reveal {
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes drift {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes kenburns {
        0% {
          transform: scale(1.06);
        }
        100% {
          transform: scale(1.01);
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="deck">
        <article class="copy">
          <span class="eyebrow">Lockscreen Motion Concept</span>
          <h1>잠금화면 슬라이드에<br />감성 + 반응성 추가</h1>
          <p>
            드래그/스와이프와 자동 전환을 함께 넣고, 글래스 UI와 켄번스 애니메이션으로 최신 앱 티저 느낌을 만든
            데모입니다.
          </p>
          <div class="tips">좌우 드래그, 화살표 키, 버튼 클릭으로 전환할 수 있습니다.</div>
        </article>

        <article class="phone-wrap">
          <div class="phone" id="phone">
            <div class="viewport" id="viewport" aria-label="잠금화면 이미지 슬라이더" role="region">
              <figure class="slide active">
                <img src="./src/assets/ad_real_screen_1.jpg" alt="잠금화면 이미지 1" draggable="false" />
              </figure>
              <figure class="slide">
                <img src="./src/assets/ad_real_screen_2.jpg" alt="잠금화면 이미지 2" draggable="false" />
              </figure>
              <figure class="slide">
                <img src="./src/assets/ad_real_screen_3.jpg" alt="잠금화면 이미지 3" draggable="false" />
              </figure>

              <div class="meta">
                <div class="clock" id="clock">09:41</div>
                <div class="date" id="date">2월 11일 수요일</div>
                <div class="notice" id="notice">새로운 스타일의 잠금화면 슬라이드를 확인해보세요.</div>
              </div>
            </div>

            <div class="controls">
              <button class="btn" id="prev" aria-label="이전 슬라이드">◀</button>
              <button class="btn" id="next" aria-label="다음 슬라이드">▶</button>
            </div>

            <div class="progress" id="progress" aria-hidden="true"></div>
          </div>
        </article>
      </section>
    </main>

    <script>
      const viewport = document.getElementById("viewport");
      const phone = document.getElementById("phone");
      const slides = [...document.querySelectorAll(".slide")];
      const progressWrap = document.getElementById("progress");
      const clock = document.getElementById("clock");
      const dateLabel = document.getElementById("date");
      const notice = document.getElementById("notice");
      const prevBtn = document.getElementById("prev");
      const nextBtn = document.getElementById("next");

      const notices = [
        "새로운 스타일의 잠금화면 슬라이드를 확인해보세요.",
        "글래스 카드와 깊이감 있는 모션으로 집중도를 높였습니다.",
        "터치 제스처 중심 인터랙션을 프로토타입에 바로 적용할 수 있습니다.",
      ];

      let active = 0;
      let pointerDown = false;
      let startX = 0;
      let deltaX = 0;
      let autoTimer;
      let progressTimer;
      let progress = 0;
      const cycle = 4600;
      const step = 40;

      const dots = slides.map(() => {
        const dot = document.createElement("span");
        dot.className = "dot";
        dot.innerHTML = "<span></span>";
        progressWrap.appendChild(dot);
        return dot.firstElementChild;
      });

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function updateTime() {
        const now = new Date();
        const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
        clock.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
        dateLabel.textContent = `${now.getMonth() + 1}월 ${now.getDate()}일 ${weekdays[now.getDay()]}요일`;
      }

      function drawProgress() {
        dots.forEach((bar, i) => {
          if (window.matchMedia("(max-width: 920px)").matches) {
            bar.style.width = i === active ? `${progress}%` : i < active ? "100%" : "0%";
          } else {
            bar.style.height = i === active ? `${progress}%` : i < active ? "100%" : "0%";
          }
        });
      }

      function setActive(index) {
        active = (index + slides.length) % slides.length;

        slides.forEach((slide, i) => {
          slide.classList.toggle("active", i === active);
        });

        notice.textContent = notices[active];
        progress = 0;
        drawProgress();
      }

      function move(dir) {
        setActive(active + dir);
        restartAuto();
      }

      function startProgress() {
        clearInterval(progressTimer);
        progressTimer = setInterval(() => {
          progress = Math.min(100, progress + (step / cycle) * 100);
          drawProgress();
        }, step);
      }

      function restartAuto() {
        clearInterval(autoTimer);
        startProgress();
        autoTimer = setInterval(() => move(1), cycle);
      }

      function onPointerDown(event) {
        pointerDown = true;
        viewport.classList.add("dragging");
        startX = event.clientX;
        deltaX = 0;
      }

      function onPointerMove(event) {
        if (!pointerDown) return;
        deltaX = event.clientX - startX;
        const activeSlide = slides[active];
        activeSlide.style.transform = `translateX(${deltaX * 0.25}px) scale(1)`;
      }

      function onPointerUp() {
        if (!pointerDown) return;
        pointerDown = false;
        viewport.classList.remove("dragging");

        const threshold = 45;
        slides[active].style.transform = "";

        if (deltaX > threshold) move(-1);
        else if (deltaX < -threshold) move(1);
      }

      function attachTilt() {
        phone.addEventListener("pointermove", (event) => {
          const rect = phone.getBoundingClientRect();
          const x = (event.clientX - rect.left) / rect.width - 0.5;
          const y = (event.clientY - rect.top) / rect.height - 0.5;
          phone.style.setProperty("--rx", `${-y * 8}deg`);
          phone.style.setProperty("--ry", `${x * 10}deg`);
        });

        phone.addEventListener("pointerleave", () => {
          phone.style.setProperty("--rx", "0deg");
          phone.style.setProperty("--ry", "0deg");
        });
      }

      prevBtn.addEventListener("click", () => move(-1));
      nextBtn.addEventListener("click", () => move(1));

      viewport.addEventListener("pointerdown", onPointerDown);
      viewport.addEventListener("pointermove", onPointerMove);
      window.addEventListener("pointerup", onPointerUp);

      window.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") move(-1);
        if (event.key === "ArrowRight") move(1);
      });

      viewport.addEventListener("mouseenter", () => {
        clearInterval(autoTimer);
        clearInterval(progressTimer);
      });

      viewport.addEventListener("mouseleave", restartAuto);
      window.addEventListener("resize", drawProgress);

      updateTime();
      setInterval(updateTime, 1000);
      drawProgress();
      attachTilt();
      restartAuto();
    </script>
  </body>
</html>
